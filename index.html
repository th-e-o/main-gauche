<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
<title>Main gauche jazz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen phone app — header, chord chart strip, chord + keyboard stage, sticky control bar */
:root{
  --bg:#eceff3; --surface:#ffffff; --fg:#161b26; --muted:#5b6474; --line:#d3d8e0;
  --brass:#a3670a; --teal:#0d8578; --sel:#3b5fc4; --bad:#c2362f; --good:#2b8a3e;
  --on-color:#ffffff;
  --kw:#fbfbfc; --kb:#1d2230; --kedge:#b4bbc7; --klabel:#59616f;
  --f-chord:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131b; --surface:#191e2a; --fg:#e9ecf2; --muted:#98a1b3; --line:#2a3142;
  --brass:#e3ac4a; --teal:#4fc9b9; --sel:#8aa4f2; --bad:#ef6a5f; --good:#5bc277;
  --on-color:#10131b;
  --kw:#e6e9ef; --kb:#07090e; --kedge:#2a3142; --klabel:#59616f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131b; --surface:#191e2a; --fg:#e9ecf2; --muted:#98a1b3; --line:#2a3142;
  --brass:#e3ac4a; --teal:#4fc9b9; --sel:#8aa4f2; --bad:#ef6a5f; --good:#5bc277;
  --on-color:#10131b;
  --kw:#e6e9ef; --kb:#07090e; --kedge:#2a3142; --klabel:#59616f; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.brand{font-family:var(--f-chord);font-size:22px;line-height:1;flex:1;min-width:0;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:500;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:var(--fg)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-block:6px 8px;scrollbar-width:none;align-items:center}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-family:var(--f-chord);font-size:17px;cursor:pointer;line-height:1.2}
.chip.cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.ok{border-color:var(--good);box-shadow:inset 0 -3px 0 var(--good)}
.chip.miss{border-color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)}
.chip:disabled{cursor:default}
.sep{flex:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.chordbox{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sym{font-family:var(--f-chord);font-size:clamp(46px,14vw,68px);line-height:.95}
.meta{display:flex;gap:10px;color:var(--muted);font-size:13px;margin-top:4px;flex-wrap:wrap}
.meta b{color:var(--fg);font-weight:600}
.chord-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{font-size:12px;font-weight:600;letter-spacing:.04em;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.next{font-size:13px;color:var(--muted)}
.next b{font-family:var(--f-chord);font-size:20px;color:var(--fg);font-weight:700}
.kbwrap{position:relative;user-select:none;-webkit-user-select:none}
.rail{position:relative;height:50px}
.tag{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;padding:2px 5px;border-radius:6px;font-size:12px;font-weight:600;line-height:1.15;white-space:nowrap;background:var(--fg);color:var(--bg)}
.tag i{font-style:normal;font-family:var(--f-mono);font-size:10px;font-weight:500;opacity:.85}
.tag.held{background:var(--teal);color:var(--on-color)}
.tag.moved{background:var(--brass);color:var(--on-color)}
.tag.sel{background:var(--sel);color:var(--on-color)}
.tag.ok{background:var(--good);color:var(--on-color)}
.tag.wrong{background:var(--bad);color:var(--on-color)}
.tag.missing{background:var(--surface);color:var(--fg);border:1.5px dashed var(--teal)}
.kb{position:relative;height:clamp(130px,26vh,190px);touch-action:manipulation}
.key{position:absolute;top:0;cursor:pointer}
.key.w{height:100%;background:var(--kw);border:1px solid var(--kedge);border-radius:0 0 7px 7px;z-index:1}
.key.b{height:60%;background:var(--kb);border-radius:0 0 4px 4px;z-index:2;box-shadow:inset 0 -4px 0 rgba(255,255,255,.08)}
.key:active{filter:brightness(.92)}
.key .clab{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9px;color:var(--klabel);font-family:var(--f-mono)}
.key.w.held{background:color-mix(in srgb,var(--teal) 62%,var(--kw))}
.key.b.held{background:var(--teal)}
.key.w.moved{background:color-mix(in srgb,var(--brass) 62%,var(--kw))}
.key.b.moved{background:var(--brass)}
.key.w.sel{background:color-mix(in srgb,var(--sel) 55%,var(--kw))}
.key.b.sel{background:var(--sel)}
.key.w.ok{background:color-mix(in srgb,var(--good) 60%,var(--kw))}
.key.b.ok{background:var(--good)}
.key.w.wrong{background:color-mix(in srgb,var(--bad) 60%,var(--kw))}
.key.b.wrong{background:var(--bad)}
.key.missing{outline:2.5px dashed var(--teal);outline-offset:-5px}
.key.hint::before{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--teal)}
.key.ghost::after{content:"";position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;border:2px solid var(--muted)}
.key.b.ghost::after{bottom:8px;border-color:#9aa3b3}
.info{display:flex;flex-direction:column;gap:10px}
.msg{font-size:14px;line-height:1.45}
.msg.good{color:var(--good);font-weight:600}
.msg.bad{color:var(--bad);font-weight:600}
.vt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.vt-row{display:grid;grid-template-columns:1fr 18px 1fr auto;align-items:center;gap:6px;padding-block:4px;border-bottom:1px solid var(--line);font-size:14px}
.vt-row:last-of-type{border-bottom:0}
.vt-row i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}
.vt-arrow{color:var(--muted);text-align:center}
.mv{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mv.held{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal)}
.mv.moved{background:color-mix(in srgb,var(--brass) 18%,transparent);color:var(--brass)}
.vt-sum{font-size:12px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.ring{border-radius:50%;border:2px solid var(--muted)}
details{font-size:13.5px;line-height:1.5;color:var(--muted);max-width:65ch}
details summary{cursor:pointer;color:var(--fg);font-weight:500}
details p{margin:.5em 0}
details b{color:var(--fg)}
.controls{display:flex;gap:8px;padding-block:10px 12px;border-top:1px solid var(--line)}
.btn{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px;cursor:pointer;padding:0 8px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.btn.on{background:var(--brass);color:var(--on-color);border-color:var(--brass)}
.btn:disabled{opacity:.45;cursor:default}
.midi{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.sheet-back{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--f-chord);font-size:26px;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--brass)}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--brass)}
.range output{font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.tune-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn.sm{flex:none;min-height:36px;font-size:13px;padding:0 12px;border-radius:9px;background:var(--bg)}
.editor{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.editor input,.editor textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.editor textarea{font-family:var(--f-mono);font-size:14px;line-height:1.6;resize:vertical}
.help{font-size:12px;color:var(--muted);line-height:1.5}
.help b{color:var(--fg)}
.editor .field select{background:var(--surface)}
.micbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;font-weight:500;cursor:pointer}
.micbtn svg{width:16px;height:16px;stroke:currentColor}
.micbtn[aria-pressed="true"]{background:var(--teal);color:var(--on-color);border-color:var(--teal)}
.micbtn .lvl{display:none;width:34px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--on-color) 30%,transparent);overflow:hidden}
.micbtn[aria-pressed="true"] .lvl{display:inline-block}
.micbtn .lvl i{display:block;height:100%;width:0;background:var(--on-color)}
.note{font-size:13px;line-height:1.45;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.course{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:6px 20px}
.course h1{font-family:var(--f-chord);font-size:30px;margin:0;line-height:1.1}
.course .intro{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.5;max-width:60ch}
.overall{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.stg h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stg p{margin:4px 0 8px;font-size:13.5px;color:var(--muted);line-height:1.45;max-width:62ch}
.lvls{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.lvl{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.lvl:last-child{border-bottom:0}
.lvl .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.lvl.done .num{background:var(--teal);border-color:var(--teal);color:var(--on-color)}
.lvl.next{background:color-mix(in srgb,var(--brass) 10%,transparent)}
.lvl.next .num{border-color:var(--brass);color:var(--brass)}
.lvl b{display:block;font-weight:600;font-size:14.5px}
.lvl small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.stars{font-size:13px;letter-spacing:1px;color:var(--brass);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.stars .off{color:var(--line)}
.stars em{display:block;font-style:normal;font-size:11px;color:var(--muted);letter-spacing:0}
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.result .big{font-family:var(--f-chord);font-size:34px;line-height:1}
.result .stars{text-align:left;font-size:22px}
.lvltag{color:var(--brass);font-weight:600}
@media (max-width:460px){.brand{display:none}.top{justify-content:space-between}.seg button{padding:6px 10px;font-size:13.5px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Main gauche<small>conduite de voix jazz</small></div>
    <div class="seg" role="tablist">
      <button id="tab-course" role="tab">Parcours</button>
      <button id="tab-demo" class="on" role="tab">Voir</button>
      <button id="tab-ex" role="tab">S'exercer</button>
    </div>
    <button id="btn-set" class="icon-btn" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
  </header>
  <nav class="strip" id="strip" aria-label="Grille"></nav>
  <main class="course" id="course" hidden></main>
  <main class="stage" id="stage">
    <section class="chordbox">
      <div>
        <div class="sym" id="sym">Dm7</div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="chord-side">
        <span class="midi" id="midi" hidden>MIDI connecté</span>
        <button class="micbtn" id="mic-btn" hidden aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span id="mic-lab">Écouter le piano</span><i class="lvl"><i id="mic-lvl"></i></i>
        </button>
        <span class="pill" id="formpill"></span>
        <span class="next" id="next"></span>
      </div>
    </section>
    <div class="kbwrap">
      <div class="rail" id="rail"></div>
      <div class="kb" id="kb"></div>
    </div>
    <section class="info" id="info"></section>
  </main>
  <footer class="controls" id="controls"></footer>
</div>

<div class="sheet-back" id="sheet" hidden>
  <form class="sheet" id="setform">
    <h2>Réglages</h2>
    <div class="field"><label for="set-type">Exercice</label>
      <select id="set-type"></select></div>
    <div class="field"><label for="set-prog">Grille</label><select id="set-prog"></select>
      <div class="tune-actions">
        <button type="button" class="btn sm" id="tune-new">Nouvelle grille</button>
        <button type="button" class="btn sm" id="tune-edit">Modifier</button>
        <button type="button" class="btn sm" id="tune-del">Supprimer</button>
      </div></div>
    <div class="editor" id="editor" hidden>
      <div class="field"><label for="ed-name">Nom de la grille</label><input id="ed-name" type="text" autocomplete="off"></div>
      <div class="row2">
        <div class="field"><label for="ed-key">Tonalité d'origine</label><select id="ed-key"></select></div>
        <div class="field"><label for="ed-mode">Mode</label><select id="ed-mode"><option value="maj">majeur</option><option value="min">mineur</option></select></div>
      </div>
      <div class="field"><label for="ed-text">Accords</label>
        <textarea id="ed-text" rows="7" spellcheck="false" placeholder="Dm7 G7 | Cmaj7 | % | Am7b5 D7alt | Gm6"></textarea>
        <small class="help">Mesures séparées par <b>|</b>. Deux accords dans une mesure = 2 temps chacun. <b>%</b> répète la mesure précédente. Qualités reconnues : maj7 (Δ, 6), m7 (-7), 7, m7b5 (ø), 7alt (7b9, 7#9, 7b13…), m6, dim7 (°7). Les basses /X sont ignorées.</small></div>
      <div class="msg bad" id="ed-err"></div>
      <div class="tune-actions">
        <button type="button" class="btn" id="ed-cancel">Annuler</button>
        <button type="button" class="btn primary" id="ed-save">Enregistrer la grille</button>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label for="set-key">Tonalité</label><select id="set-key"></select></div>
      <div class="field"><label for="set-keymode">Tons</label>
        <select id="set-keymode">
          <option value="cycle">12 tons (quartes)</option>
          <option value="fixed">Tonalité fixe</option>
          <option value="random">Tons au hasard</option>
        </select></div>
    </div>
    <div class="row2">
      <div class="field"><label for="set-start">Premier accord</label>
        <select id="set-start"></select></div>
      <div class="field"><label for="set-names">Noms des notes</label>
        <select id="set-names">
          <option value="fr">Do Ré Mi</option>
          <option value="en">C D E</option>
        </select></div>
    </div>
    <div class="field"><label for="set-bpm">Tempo (lecture auto)</label>
      <div class="range"><input type="range" id="set-bpm" min="50" max="180" step="2"><output id="bpm-out"></output></div></div>
    <label class="check"><input type="checkbox" id="set-bass"> Jouer la basse (fondamentale) avec l'accord</label>
    <label class="check"><input type="checkbox" id="set-ghost"> Montrer l'accord précédent (cercles)</label>
    <label class="check"><input type="checkbox" id="set-auto"> Passer à l'accord suivant après une bonne réponse</label>
    <button type="submit" class="btn primary">Fermer</button>
  </form>
</div>

<script>
(function(){
"use strict";
/* ---------- théorie ---------- */
const L_EN=['C','D','E','F','G','A','B'], L_FR=['Do','Ré','Mi','Fa','Sol','La','Si'], L_PC=[0,2,4,5,7,9,11];
const SIMPLE=[[0,0],[1,-1],[1,0],[2,-1],[2,0],[3,0],[4,-1],[4,0],[5,-1],[5,0],[6,-1],[6,0]];
function spell(l,pc){let a=((pc-L_PC[l])%12+12)%12;if(a>6)a-=12;return{l,acc:a};}
function simple(pc){const s=SIMPLE[pc];return{l:s[0],acc:s[1]};}
function acc(a){return a===0?'':a>0?'♯'.repeat(a):'♭'.repeat(-a);}
function nm(sp,lang){return ((lang||S.names)==='fr'?L_FR:L_EN)[sp.l]+acc(sp.acc);}
function octOf(m){return Math.floor(m/12)-(S.names==='fr'?2:1);}

function parseChord(tok){
  const m=tok.match(/^([A-Ga-g])([b#♭♯]?)(.*)$/);if(!m)return null;
  const l='CDEFGAB'.indexOf(m[1].toUpperCase()),a=(m[2]==='b'||m[2]==='♭')?-1:m[2]?1:0;
  const s=m[3].split('/')[0].replace(/[()]/g,'');let q=null;
  if(/^(m7b5|m7♭5|-7b5|-7♭5|ø|min7b5|h7?)$/.test(s))q='hd';
  else if(/^(dim7?|o7?|°7?)$/.test(s))q='dim';
  else if(/^(m6|-6|m69|m6\/9|mmaj7|mM7|m\^7|-\^7|mΔ7?|-Δ7?|m∆7?|-∆7?|mmaj|min6)$/.test(s))q='m6';
  else if(/^(m|-|min|mi)(7|9|11|13)?$/.test(s))q='m7';
  else if(/^(maj7|maj9|maj|M7|M9|M|Δ7?|∆7?|\^7?|ma7|6|69|6\/9|add9|)$/.test(s))q='maj7';
  else if(/^7?(alt|b9|#9|♭9|♯9|b13|♭13|#5|\+|aug)/.test(s)||/^7.*(alt|b9|#9|♭9|♯9|b13|♭13|#5)/.test(s))q='alt';
  else if(/^(7|9|11|13|7sus4?|9sus4?|13sus4?|sus4?|7#11|9#11|13#11)$/.test(s))q='dom';
  if(!q)return null;
  return{l,pc:(L_PC[l]+a+12)%12,q};
}
function parseKey(str){const m=String(str).trim().match(/^([A-Ga-g])([b#♭♯]?)(m|-|min)?$/);if(!m)return null;const l='CDEFGAB'.indexOf(m[1].toUpperCase()),a=(m[2]==='b'||m[2]==='♭')?-1:m[2]?1:0;return{l,pc:(L_PC[l]+a+12)%12,minor:!!m[3]};}
function parseGrid(text){
  const bars=String(text).split(/[|\n]/).map(s=>s.trim()).filter(Boolean),out=[],bad=[];let last=null;
  for(const b of bars){
    let toks=b.split(/\s+/).filter(Boolean);
    if(toks.length===1&&toks[0]==='%'){if(!last)continue;toks=last;}
    const cs=[];
    for(const t of toks){if(t==='%'||t==='/'||t==='-'){if(cs.length)cs.push(cs[cs.length-1]);continue;}const c=parseChord(t);if(c)cs.push(c);else bad.push(t);}
    if(!cs.length)continue;last=toks;
    const beats=4/cs.length;
    cs.forEach(c=>{const p=out[out.length-1];if(p&&p.pc===c.pc&&p.q===c.q&&p.l===c.l)p.beats+=beats;else out.push({l:c.l,pc:c.pc,q:c.q,beats});});
  }
  return{chords:out,bad};
}
function tuneToProg(t){
  const k=parseKey(t.key)||{l:0,pc:0,minor:false};const g=parseGrid(t.text);
  return{name:t.name,tune:true,custom:!!t.custom,minor:k.minor||!!t.minor,keyPc:k.pc,src:t,
    ch:g.chords.map(c=>[(c.pc-k.pc+12)%12,(c.l-k.l+7)%7,c.q,c.beats])};
}

function badRoot(sp){return Math.abs(sp.acc)>1||(sp.acc===-1&&(sp.l===0||sp.l===3))||(sp.acc===1&&(sp.l===2||sp.l===6));}
function toneSp(ch,t){const l=(ch.sp.l+t[1]-1)%7,pc=(ch.pc+t[0])%12;let sp=spell(l,pc);if(Math.abs(sp.acc)>1)sp=simple(pc);return{sp,lab:t[2]};}
const candCache=new Map();
function candidatesT(type,ch){
  const key=type+'|'+ch.pc+'|'+ch.q+'|'+ch.sp.l+ch.sp.acc;
  if(candCache.has(key))return candCache.get(key);
  const T=TYPES[type],out=[];
  if(T.upper){
    const r=36+ch.pc,bt={sp:ch.sp,lab:'1'};
    candidatesT(T.upper,ch).forEach(c=>out.push({form:c.form,notes:[r,...c.notes],root:r,tones:[bt,...c.tones]}));
  }else{
    const F=T.forms(ch.q);
    for(const form of Object.keys(F)){
      const tones=F[form];
      for(let k=1;k<9;k++){
        const root=ch.pc+12*k,notes=tones.map(t=>root+t[0]);
        if(!T.fit(notes,root))continue;
        out.push({form,notes,root,tones:tones.map(t=>toneSp(ch,t))});
      }
    }
  }
  candCache.set(key,out);return out;
}
function candidates(ch){return candidatesT(S.type,ch);}
function skipN(){return TYPES[S.type].skip||0;}
function rawCost(p,c){let s=0;for(let i=skipN();i<c.notes.length;i++)s+=Math.abs(c.notes[i]-p.notes[i]);return s;}
function mean(a){return a.reduce((x,y)=>x+y,0)/a.length;}
function fullCost(p,c){let s=rawCost(p,c);if(skipN())s+=0.01*Math.abs(c.root-p.root);return s+0.001*Math.abs(mean(c.notes)-TYPES[S.type].center);}
function bestOf(p,cs){let b=null,bc=1e9;for(const c of cs){const v=fullCost(p,c);if(v<bc){bc=v;b=c;}}return b;}
function startCands(ch){const cs=candidates(ch);const f=S.start==='free'?cs:cs.filter(c=>c.form===S.start);return f.length?f:cs;}
function pickStart(cs){const T=TYPES[S.type];let b=null,bd=1e9;for(const c of cs){const d=Math.abs(mean(c.notes)-T.center)+(c.form==='A'||c.form==='R0'?0:0.01);if(d<bd){bd=d;b=c;}}return b;}
function expected(prev,ch){
  if(!prev){const acc=startCands(ch);return{acc,best:pickStart(acc)};}
  if(TYPES[S.type].free){const acc=candidates(ch);return{acc,best:bestOf(prev,acc),free:true};}
  const cs=candidates(ch), costs=cs.map(c=>rawCost(prev,c)), mn=Math.min(...costs);
  const acc=cs.filter((c,i)=>costs[i]<=mn+1e-9);return{acc,best:bestOf(prev,acc),min:mn};
}

function buildSeq(){
  const P=PROGS[S.prog],k0=KEYS[S.key];let keys;
  if(P.allKeys||S.keymode==='fixed')keys=[k0];
  else if(S.keymode==='cycle')keys=Array.from({length:12},(_,i)=>KEYS.find(k=>k.pc===(k0.pc+5*i)%12));
  else{keys=[];let last=-1;for(let i=0;i<6;i++){let k;do{k=KEYS[Math.floor(Math.random()*12)];}while(k.pc===last);keys.push(k);last=k.pc;}}
  seq=[];
  keys.forEach((k,ki)=>P.ch.forEach(([st,ls,q,b],ci)=>{const pc=(k.pc+st)%12;let sp=spell((k.l+ls)%7,pc);if(badRoot(sp))sp=simple(pc);seq.push({pc,sp,q,beats:b,key:k,ki,ci});}));
  if(S.level&&seq.length<8){const one=seq.slice();for(let r=1;r<4;r++)one.forEach(c=>seq.push(Object.assign({},c,{ki:c.ki+r*100})));}
  path=[];let prev=null;
  seq.forEach((ch,i)=>{const c=prev?bestOf(prev,candidates(ch)):pickStart(startCands(ch));path[i]=c;prev=c;});
}

  const P=PROGS[S.prog];
  if(P.allKeys)return 'Cycle des quintes';
  const n=nm(spell(ch.key.l,ch.key.pc));
  return P.blues?'Blues en '+n:'Tonalité : '+n+(P.minor?' mineur':' majeur');
}

/* ---------- audio ---------- */
let ac=null,master=null;
function audio(){
  try{
    if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const comp=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=.55;master.connect(comp);comp.connect(ac.destination);}
    if(ac.state==='suspended')ac.resume();
  }catch(e){ac=null;}
  return ac;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(m,t0,dur,vel){
  const f=mtof(m),o1=ac.createOscillator(),o2=ac.createOscillator(),g2=ac.createGain(),lp=ac.createBiquadFilter(),g=ac.createGain();
  o1.type='triangle';o1.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;
  g2.gain.setValueAtTime(.35,t0);g2.gain.exponentialRampToValueAtTime(.02,t0+.35);
  lp.type='lowpass';lp.frequency.value=Math.min(5000,f*7);
  o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(master);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vel,t0+.008);g.gain.exponentialRampToValueAtTime(vel*.35,t0+.6);g.gain.setTargetAtTime(0,t0+dur,.12);
  o1.start(t0);o2.start(t0);o1.stop(t0+dur+.8);o2.stop(t0+dur+.8);
}
function playNotes(notes,rootPc,dur){
  if(!audio())return;const t=ac.currentTime+.02;
  notes.forEach((m,i)=>tone(m,t+i*.01,dur,.16));
  if(S.bass&&!TYPES[S.type].hasBass&&S.type!=='bass'&&rootPc!=null)tone(36+rootPc,t,dur,.24);
}
function playOne(m){if(!audio())return;tone(m,ac.currentTime+.01,.5,.18);}

/* ---------- clavier ---------- */
const kbEl=document.getElementById('kb'),railEl=document.getElementById('rail');
let keyEls={},centers={},kbRange=null;
const isW=m=>[0,2,4,5,7,9,11].includes(m%12);
function buildKb(){
  const [lo,hi]=TYPES[S.type].kb;kbRange=[lo,hi];
  kbEl.innerHTML='';keyEls={};centers={};
  const whites=[];for(let m=lo;m<=hi;m++)if(isW(m))whites.push(m);
  const W=100/whites.length;
  whites.forEach((m,i)=>{const e=document.createElement('div');e.className='key w';e.style.left=(i*W)+'%';e.style.width=W+'%';e.dataset.m=m;
    if(m%12===0){const s=document.createElement('span');s.className='clab';s.dataset.c='1';e.appendChild(s);}
    kbEl.appendChild(e);keyEls[m]=e;centers[m]=(i+.5)*W;});
  for(let m=lo;m<=hi;m++)if(!isW(m)){const wi=whites.indexOf(m-1);if(wi<0)continue;const e=document.createElement('div');e.className='key b';e.style.left=((wi+1)*W-W*.31)+'%';e.style.width=(W*.62)+'%';e.dataset.m=m;kbEl.appendChild(e);keyEls[m]=e;centers[m]=(wi+1)*W;}
  labelCs();
}
function labelCs(){for(const m in keyEls){const s=keyEls[m].querySelector('.clab');if(s)s.textContent=(S.names==='fr'?'Do':'C')+octOf(+m);}}
kbEl.addEventListener('pointerdown',e=>{const k=e.target.closest('.key');if(!k)return;e.preventDefault();onKey(+k.dataset.m);});

function paint(spec){
  for(const m in keyEls)keyEls[m].classList.remove('held','moved','sel','ok','wrong','missing','hint','ghost');
  (spec.notes||[]).forEach(n=>{const e=keyEls[n.m];if(e)e.classList.add(n.cls);});
  (spec.missing||[]).forEach(n=>{const e=keyEls[n.m];if(e)e.classList.add('missing');});
  (spec.ghosts||[]).forEach(m=>{const e=keyEls[m];if(e)e.classList.add('ghost');});
  (spec.hints||[]).forEach(m=>{const e=keyEls[m];if(e)e.classList.add('hint');});
  const tags=[...(spec.notes||[]),...(spec.missing||[]).map(n=>Object.assign({},n,{cls:'missing'}))].filter(n=>keyEls[n.m]).sort((a,b)=>a.m-b.m);
  railEl.innerHTML='';const px=kbEl.clientWidth||320;const last=[-1e9,-1e9];
  tags.forEach(n=>{const x=centers[n.m]/100*px;const row=(x-last[0]>=38)?0:1;last[row]=x;
    const t=document.createElement('div');t.className='tag '+n.cls;t.style.left=centers[n.m]+'%';t.style.top=(row?24:0)+'px';
    t.innerHTML=(n.name||'')+(n.deg?'<i>'+n.deg+'</i>':'');railEl.appendChild(t);});
  railEl.style.height=tags.length?'50px':'8px';
}
function noteNameOf(m){return nm(simple(m%12));}
function resultSpec(prev,cur){
  return{notes:cur.notes.map((m,i)=>({m,cls:prev&&prev.notes.includes(m)?'held':(prev?'moved':'held'),name:nm(cur.tones[i].sp),deg:cur.tones[i].lab})),
    ghosts:(S.ghost&&prev)?prev.notes.filter(m=>!cur.notes.includes(m)):[]};
}

/* ---------- rendu ---------- */
const $=id=>document.getElementById(id);
function movTxt(d){if(d===0)return 'tenue';const a=Math.abs(d),dir=d<0?'↓ ':'↑ ';return dir+(a===1?'½ ton':a===2?'1 ton':a+' ½ tons');}
function voiceTable(prev,cur,prevCh){
  if(!prev){return '<div class="vt">'+cur.notes.map((m,i)=>'<div class="vt-row"><span></span><span></span><span>'+nm(cur.tones[i].sp)+'<i>'+cur.tones[i].lab+'</i></span><span class="mv held">départ</span></div>').reverse().join('')+
    '<div class="vt-sum">Point de départ · '+TYPES[S.type].names[cur.form]+'</div></div>';}
  let rows='',tot=0,held=0;
  const i0=skipN();
  for(let i=cur.notes.length-1;i>=0;i--){
    const d=cur.notes[i]-prev.notes[i];if(i>=i0){tot+=Math.abs(d);if(d===0)held++;}
    const isRoot=i0>0&&i===0;
    rows+='<div class="vt-row"><span>'+nm(prev.tones[i].sp)+'<i>'+prev.tones[i].lab+'</i></span><span class="vt-arrow">→</span><span>'+nm(cur.tones[i].sp)+'<i>'+cur.tones[i].lab+'</i></span><span class="mv '+(d===0?'held':'moved')+'">'+(isRoot?'basse':movTxt(d))+'</span></div>';
  }
  return '<div class="vt">'+rows+'<div class="vt-sum">'+(prevCh?sym(prevCh)+' → ':'')+'mouvement total '+tot+' demi-ton'+(tot>1?'s':'')+' · '+held+' note'+(held>1?'s':'')+' tenue'+(held>1?'s':'')+(i0?' (hors basse)':'')+'</div></div>';
}
const LEGEND='<div class="legend"><span><i class="sw" style="background:var(--teal)"></i>note tenue</span><span><i class="sw" style="background:var(--brass)"></i>note qui bouge</span><span><i class="sw ring"></i>accord précédent</span></div>';
const RULES='<details><summary>La règle du jeu</summary>'+
 '<p><b>Sans fondamentale (Bill Evans, Wynton Kelly…).</b> Forme A : la 3e en bas (3-5-7-9 ; sur un 7 : 3-13-♭7-9). Forme B : la 7e en bas (7-9-3-5 ; sur un 7 : ♭7-9-3-13). La basse ou ta main droite jouent la fondamentale.</p>'+
 '<p><b>Conduite de voix.</b> D\'un accord au suivant, chaque voix bouge le moins possible. Sur un mouvement de quarte (ii→V→I), la 7e descend d\'un demi-ton et devient la 3e de l\'accord suivant ; les autres notes restent ou glissent d\'un ton. Les formes A et B alternent donc d\'elles-mêmes.</p>'+
 '<p><b>Registre.</b> Garde la main gauche autour du Do central : trop grave, les petits intervalles deviennent boueux. Quand la grille t\'amène trop haut ou trop bas, change de forme pour revenir au centre.</p></details>';

function renderStrip(){

    if(ch.ki!==lastK&&!PROGS[S.prog].allKeys&&seq.length>PROGS[S.prog].ch.length){h+='<span class="sep">'+nm(spell(ch.key.l,ch.key.pc))+'</span>';lastK=ch.ki;}
    const r=ex.res[i];const cls='chip'+(i===idx?' cur':'')+(S.mode==='ex'&&r?' '+r:'');
    h+='<button class="'+cls+'" data-i="'+i+'"'+(S.mode==='ex'?' disabled':'')+'>'+sym(ch)+'</button>';
  });

}
$('strip').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b||S.mode==='ex')return;idx=+b.dataset.i;showDemo(true);});

function renderHead(){

function showEx(){
  renderHead();renderStrip();
  if(ex.phase==='done'){
    const r=ex.doneRes,lv=LEVELS.find(l=>l.id===S.level);
    $('formpill').hidden=true;paint({});
    $('info').innerHTML='<div class="result"><span class="big">'+Math.round(r.pct*100)+' %</span><span class="stars">'+starHtml(r.stars)+'</span><div class="msg">'+(lv?'<b>'+lv.t+'</b> : ':'')+r.ok+' accords justes du premier coup sur '+r.total+'.</div><div class="msg">'+(r.stars>=3?'Parfait. Passe au niveau suivant.':r.stars>=1?'Niveau validé. Refais-le pour viser les trois étoiles, ou passe au suivant.':'Il faut 70 % pour valider le niveau. Refais-le en prenant ton temps : la vitesse viendra ensuite.')+'</div></div>';
    renderControls();return;
  }
  const ch=seq[idx],E=expected(ex.prev,ch);
  const pill=$('formpill');
  if(ex.phase==='right'||ex.phase==='revealed'){pill.hidden=false;pill.textContent=TYPES[S.type].names[ex.answer.form];}else pill.hidden=true;
  let spec={notes:[],ghosts:[],hints:[]},msg='';
  const ghosts=(S.ghost&&ex.prev)?ex.prev.notes:[];
  const held=ex.prev?ex.prev.notes.filter(m=>E.best.notes.includes(m)):[];
  if(ex.phase==='input'||ex.phase==='wrong'){
    const inp=[...ex.input].sort((a,b)=>a-b);
    let target=null;
    if(ex.phase==='wrong'){let bo=-1;for(const c of E.acc){const o=inp.filter(m=>c.notes.includes(m)).length;if(o>bo){bo=o;target=c;}}}
    spec.notes=inp.map(m=>({m,cls:target?(target.notes.includes(m)?'ok':'wrong'):'sel',name:noteNameOf(m)}));
    spec.ghosts=ghosts.filter(m=>!ex.input.has(m));
    if(ex.hint>=1)spec.hints=held;
    const n=E.best.notes.length;
    const T=TYPES[S.type],nn=n>1?' ('+n+' notes)':'';
    if(T.free)msg='Joue <b>'+sym(ch)+'</b> : '+T.short+nn+', à n\'importe quelle octave du clavier affiché.';
    else if(!ex.prev){const fs=[...new Set(startCands(ch).map(c=>c.form))].map(f=>T.names[f]);msg='<b>Premier accord.</b> Joue '+T.short+' de '+sym(ch)+nn+' : '+fs.join(', ')+', dans le registre du clavier affiché.';}
    else msg='Joue <b>'+sym(ch)+'</b>'+nn+' : '+T.short+', en bougeant le moins possible depuis '+ex.prev.tones.map(t=>nm(t.sp)).join(' ')+'.';
    if(ex.phase==='wrong')msg='<div class="msg bad">'+ex.wrongMsg+'</div>'+msg;
    if(ex.hint>=1&&ex.prev){msg+='<div class="msg">'+(held.length?'Indice : garde '+held.map(noteNameOf).join(', ')+' (point vert) et déplace le reste d\'au plus '+maxMove(ex.prev,E.best)+' demi-ton'+(maxMove(ex.prev,E.best)>1?'s':'')+'.':'Indice : aucune note commune ; chaque voix bouge d\'au plus '+maxMove(ex.prev,E.best)+' demi-tons.')+'</div>';}
    const micNote=mic.err?'<div class="msg bad">'+mic.err+'</div>':mic.on?'<div class="note">J\'écoute ton piano : joue l\'accord et tiens-le. Il est validé tout seul quand il est juste ; sinon, appuie sur Valider pour voir ce qui cloche. La détection peut se tromper (piano désaccordé, pédale, bruit) : tu peux corriger au doigt sur le clavier.</div>':'';
    $('info').innerHTML=micNote+'<div class="msg">'+msg+'</div>'+(ex.prev?'':RULES);
  }else{
    spec=resultSpec(ex.prev,ex.answer);
    const ok=ex.phase==='right';
    $('info').innerHTML='<div class="msg '+(ok?'good':'')+'">'+(ok?(ex.tries===0&&ex.hint===0?'Juste du premier coup !':'Juste.'):'Voici le chemin le plus court :')+'</div>'+voiceTable(ex.prev,ex.answer,ex.prevCh)+LEGEND;
  }
  paint(spec);renderControls();
}
function maxMove(p,c){let m=0;const i0=skipN();for(let i=i0;i<c.notes.length;i++)m=Math.max(m,Math.abs(c.notes[i]-p.notes[i]));return m;}

function btn(label,act,cls,dis){return '<button class="btn '+(cls||'')+'" data-a="'+act+'"'+(dis?' disabled':'')+'>'+label+'</button>';}
function renderControls(){
  let h='';
  if(S.mode==='demo')h=btn('◀','prev')+btn('Écouter','listen')+btn(playing?'Pause':'Lecture','auto',playing?'on':'')+btn('▶','next','primary');
  else if(ex.phase==='done')h=btn('Recommencer','lvRetry')+(nextLevel()?btn('Niveau suivant ▶','lvNext','primary'):btn('Parcours','lvList','primary'));
  else if(ex.phase==='input'||ex.phase==='wrong')h=btn('Effacer','clear','',!ex.input.size)+btn(!ex.prev||TYPES[S.type].free||ex.hint>=1||ex.tries>0?'Solution':'Indice','hint')+btn('Valider','check','primary');
  else h=btn('Écouter','listenEx')+btn('Suivant ▶','exnext','primary');
  $('controls').innerHTML=h;
}
$('controls').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;audio();act(b.dataset.a);});

function act(a){
  if(a==='prev'){stopAuto();idx=(idx-1+seq.length)%seq.length;showDemo(true);}
  else if(a==='next'){stopAuto();idx=(idx+1)%seq.length;showDemo(true);}
  else if(a==='listen'){playNotes(path[idx].notes,seq[idx].pc,1.6);}
  else if(a==='auto'){if(playing)stopAuto();else{playing=true;tick(true);}renderControls();}
  else if(a==='clear'){ex.input.clear();ex.phase='input';showEx();}
  else if(a==='hint'){
    if(ex.hint>=1&&ex.prev||ex.tries>0||!ex.prev||TYPES[S.type].free){reveal();}else{ex.hint=1;showEx();}
  }
  else if(a==='check')check();
  else if(a==='listenEx'){playNotes(ex.answer.notes,seq[idx].pc,1.6);}
  else if(a==='exnext')exNext();
  else if(a==='lvRetry')startLevel(S.level);
  else if(a==='lvNext')startLevel(nextLevel().id);
  else if(a==='lvList')setMode('course');
}
function tick(first){
  if(!playing)return;
  if(!first){idx=(idx+1)%seq.length;}
  showDemo(true);
  timer=setTimeout(()=>tick(false),seq[idx].beats*60000/S.bpm);
}
function stopAuto(){playing=false;clearTimeout(timer);}

/* ---------- exercice ---------- */
function onKey(m){
  if(S.mode==='demo'){playOne(m);return;}
  if(ex.phase==='right'||ex.phase==='revealed'||ex.phase==='done'){playOne(m);return;}
  if(ex.input.has(m))ex.input.delete(m);else{ex.input.add(m);playOne(m);}
  ex.phase='input';showEx();
}
function check(){
  const ch=seq[idx],E=expected(ex.prev,ch),inp=[...ex.input].sort((a,b)=>a-b),n=E.best.notes.length;
  if(!inp.length){ex.phase='wrong';ex.wrongMsg='Touche les notes sur le clavier, puis valide.';showEx();return;}
  const eq=c=>c.notes.length===inp.length&&c.notes.every((m,i)=>m===inp[i]);
  const hit=E.acc.find(eq);
  if(!mic.on)playNotes(inp,ch.pc,1.4);
  if(hit){finish(hit,'right');return;}
  ex.tries++;ex.phase='wrong';
  const other=candidates(ch).find(eq);
  if(other)ex.wrongMsg='C\'est bien un voicing de '+sym(ch)+' ('+TYPES[S.type].names[other.form]+'), mais pas le chemin le plus court : '+rawCost(ex.prev,other)+' demi-tons de mouvement au lieu de '+E.min+'.';
  else if(inp.length!==n)ex.wrongMsg='Il faut '+n+' notes (tu en as '+inp.length+').';
  else{let bo=0;for(const c of E.acc)bo=Math.max(bo,inp.filter(m=>c.notes.includes(m)).length);ex.wrongMsg=bo+' note'+(bo>1?'s':'')+' juste'+(bo>1?'s':'')+' sur '+n+'. En rouge : à changer.';}
  showEx();
}
function reveal(){const E=expected(ex.prev,seq[idx]);ex.tries++;finish(E.best,'revealed');playNotes(E.best.notes,seq[idx].pc,1.4);}
function finish(ans,phase){
  ex.answer=ans;ex.phase=phase;mic.armed=false;mic.hist=[];mic.key='';ex.prevCh=idx>0||ex.prev?ex.prevChord:null;
  const first=phase==='right'&&ex.tries===0&&ex.hint===0;
  ex.stats.total++;if(first){ex.stats.ok++;ex.stats.streak++;if(ex.stats.streak>best){best=ex.stats.streak;try{localStorage.setItem(STORE+'-best',best);}catch(e){}}}else ex.stats.streak=0;
  ex.res[idx]=first?'ok':'miss';
  showEx();
  if(phase==='right'&&S.auto){clearTimeout(timer);timer=setTimeout(()=>{if(S.mode==='ex'&&ex.phase==='right')exNext();},1500);}
}
function exNext(){
  clearTimeout(timer);
  ex.prevVoicingCh=seq[idx];
  ex.prev=ex.answer;ex.prevChord=seq[idx];
  idx++;if(idx>=seq.length&&S.level){finishLevel();return;}
  if(idx>=seq.length){if(S.keymode==='random'&&!PROGS[S.prog].allKeys)buildSeq();idx=0;ex.res={};}
  ex.input.clear();midiHeld.clear();ex.phase='input';ex.hint=0;ex.tries=0;ex.answer=null;
  showEx();
}
function resetEx(){ex.prev=null;ex.prevChord=null;ex.input.clear();ex.phase='input';ex.hint=0;ex.tries=0;ex.answer=null;ex.res={};ex.stats={ok:0,total:0,streak:0};}

/* ---------- MIDI ---------- */
try{
  if(navigator.requestMIDIAccess)navigator.requestMIDIAccess().then(acc=>{
    const hook=()=>{let n=0;acc.inputs.forEach(i=>{i.onmidimessage=onMidi;n++;});$('midi').hidden=n===0;};hook();acc.onstatechange=hook;
  }).catch(()=>{});
}catch(e){}
function onMidi(e){
  const [st,n,v]=e.data,c=st&0xf0;
  if(c===0x90&&v>0){midiHeld.add(n);
    if(S.mode!=='ex'||ex.phase==='right'||ex.phase==='revealed'||ex.phase==='done')return;
    ex.input=new Set(midiHeld);ex.phase='input';showEx();
    const want=expected(ex.prev,seq[idx]).best.notes.length;
    if(midiHeld.size===want)setTimeout(()=>{if(ex.phase==='input'&&ex.input.size===want)check();},120);
  }else if(c===0x80||(c===0x90&&v===0)){midiHeld.delete(n);}
}

$('setform').addEventListener('change',e=>{
  const id=e.target.id;if(!id||id.startsWith('ed-'))return;
  const structural=['set-type','set-prog','set-key','set-keymode','set-start'].includes(id);
  S.type=$('set-type').value;S.prog=progSel.value;S.key=+$('set-key').value;S.keymode=$('set-keymode').value;S.start=$('set-start').value;
  S.names=$('set-names').value;S.bass=$('set-bass').checked;S.ghost=$('set-ghost').checked;S.auto=$('set-auto').checked;S.bpm=+$('set-bpm').value;
  if(id==='set-prog'){const P=PROGS[S.prog];if(P.tune){S.key=KEYS.findIndex(k=>k.pc===P.keyPc);S.keymode='fixed';$('set-key').value=S.key;$('set-keymode').value='fixed';}fillProgs();closeEditor();}
  if(id==='set-names'){fillKeys();labelCs();}
  $('set-keymode').disabled=!!PROGS[S.prog].allKeys;
  save();
  if(id==='set-type')fillStart();
  if(structural){S.level=null;save();rebuild(id==='set-type');}
});
function rebuild(kb){candCache.clear();buildSeq();idx=0;resetEx();if(kb)buildKb();}

/* ---------- éditeur de grilles ---------- */
let editing=null,delArmed=false;
(function(){const ks=$('ed-key');KEYS.forEach(k=>{const o=document.createElement('option');o.value=k.id;o.textContent=k.id.replace('b','♭');ks.appendChild(o);});})();
function progToText(P,k){
  const bars=[];let cur=[],beats=0,prevTxt=null;
  P.ch.forEach(([st,ls,q,b])=>{
    const pc=(k.pc+st)%12;let sp=spell((k.l+ls)%7,pc);if(badRoot(sp))sp=simple(pc);
    const t=nm(sp,'en')+Q[q].sym;let left=b;
    while(left>0){const take=Math.min(left,4-beats);cur.push(t);beats+=take;left-=take;
      if(beats>=4){const bt=cur.filter((x,i)=>i===0||x!==cur[i-1]).join(' ');bars.push(bt===prevTxt&&cur.length&&!bt.includes(' ')?'%':bt);prevTxt=bt;cur=[];beats=0;}}
  });
  if(cur.length)bars.push(cur.join(' '));
  return bars.reduce((a,b,i)=>a+(i?(i%4===0?' |\n':' | '):'')+b,'');
}
function openEditor(src){
  editing=src;$('editor').hidden=false;$('ed-err').textContent='';
  $('ed-name').value=src.name;
  const k=parseKey(src.key)||{l:0,pc:0,minor:false};
  $('ed-key').value=KEYS.find(x=>x.pc===k.pc).id;$('ed-mode').value=(k.minor||src.minor)?'min':'maj';
  $('ed-text').value=src.text;$('ed-name').focus();
}
function closeEditor(){editing=null;$('editor').hidden=true;}
$('tune-new').addEventListener('click',()=>openEditor({id:null,name:'Ma grille',key:'C',text:'Dm7 G7 | Cmaj7 | Am7b5 D7alt | Gm6'}));
$('tune-edit').addEventListener('click',()=>{
  const P=PROGS[S.prog];
  if(P.custom){openEditor(Object.assign({},P.src));return;}
  if(P.tune){openEditor({id:null,name:P.name+' (copie)',key:P.src.key,text:P.src.text});return;}
  const k=KEYS[S.key];openEditor({id:null,name:P.name+' (copie)',key:k.id+(P.minor?'m':''),text:progToText(P,k)});
});
$('tune-del').addEventListener('click',e=>{
  const P=PROGS[S.prog];if(!P.custom)return;
  if(!delArmed){delArmed=true;e.target.textContent='Confirmer la suppression';setTimeout(()=>{delArmed=false;e.target.textContent='Supprimer';},4000);return;}
  delArmed=false;CUSTOM=CUSTOM.filter(t=>t.id!==S.prog);saveCustom();registerTunes();S.prog='251';save();fillProgs();syncForm();closeEditor();rebuild(false);
});
$('ed-cancel').addEventListener('click',closeEditor);
$('ed-save').addEventListener('click',()=>{
  const name=$('ed-name').value.trim()||'Ma grille',text=$('ed-text').value,key=$('ed-key').value+($('ed-mode').value==='min'?'m':'');
  const g=parseGrid(text);
  if(g.bad.length){$('ed-err').textContent='Accords non reconnus : '+[...new Set(g.bad)].join(', ')+'.';return;}
  if(!g.chords.length){$('ed-err').textContent='Écris au moins un accord, par exemple « Dm7 G7 | Cmaj7 ».';return;}
  const t={id:editing&&editing.id?editing.id:'c-'+Date.now().toString(36),name,key,text};
  const i=CUSTOM.findIndex(x=>x.id===t.id);if(i>=0)CUSTOM[i]=t;else CUSTOM.push(t);
  saveCustom();registerTunes();S.prog=t.id;S.key=KEYS.findIndex(k=>k.pc===PROGS[t.id].keyPc);S.keymode='fixed';save();
  fillProgs();syncForm();closeEditor();rebuild(false);
});

/* ---------- écoute micro ---------- */
function detectNotes(mag,sr,N,lo,hi){
  const bw=sr/N,spec=Float32Array.from(mag),L=spec.length;
  function pk(f,needMax){
    const a=Math.max(1,Math.floor(f*0.983/bw)),b=Math.min(L-2,Math.ceil(f*1.017/bw));let mx=0,k0=-1;
    for(let k=a;k<=b;k++)if(spec[k]>mx){mx=spec[k];k0=k;}
    if(needMax&&(k0<0||spec[k0]<spec[k0-1]||spec[k0]<spec[k0+1]||k0===a||k0===b))return 0;
    return mx;
  }
  const kA=Math.floor(70/bw),kB=Math.floor(4000/bw),srt=Array.from(mag.subarray(kA,kB)).sort((x,y)=>x-y);
  const floor=srt[Math.floor(srt.length*.6)]||1e-9;
  const notes=[];let first=0;
  for(let it=0;it<7;it++){
    let bm=-1,bs=0;
    for(let m=lo;m<=hi;m++){
      if(notes.includes(m))continue;const f=440*Math.pow(2,(m-69)/12);
      const p1=pk(f,true);if(p1<floor*8)continue;
      let s=0;for(let h=1;h<=8;h++){const fh=f*h;if(fh>sr/2-200)break;s+=pk(fh,false)/Math.sqrt(h);}
      if(s>bs){bs=s;bm=m;}
    }
    if(bm<0)break;if(!first)first=bs;else if(bs<first*.14)break;
    notes.push(bm);
    const f=440*Math.pow(2,(bm-69)/12);
    for(let h=1;h<=12;h++){const fh=f*h,a=Math.floor(fh*0.983/bw),b=Math.ceil(fh*1.017/bw);for(let k=a;k<=b&&k<L;k++)spec[k]*=(h===1?0:.1);}
  }
  return notes.sort((a,b)=>a-b);
}
const mic={on:false,stream:null,an:null,timer:null,hist:[],armed:true,rmsHist:[],err:'',key:''};
function micError(e){
  let framed=false;try{framed=window.top!==window.self;}catch(x){framed=true;}
  const host=location.hostname,n=e&&e.name||'';
  if(framed||/claude\.ai|claudeusercontent/.test(host))return 'Le micro est bloqué dans les pages claude.ai. Ouvre plutôt https://th-e-o.github.io/main-gauche/ dans Chrome ou Safari.';
  if(!window.isSecureContext)return 'Le micro demande une adresse en https. Ouvre https://th-e-o.github.io/main-gauche/.';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return 'Ce navigateur ne donne pas accès au micro. Si tu as ouvert le lien depuis une autre app (Claude, messagerie…), ouvre-le dans Chrome ou Safari : menu ⋮ ou ⋯ puis « Ouvrir dans le navigateur ».';
  if(n==='NotAllowedError'||n==='SecurityError')return 'Accès au micro refusé. Si le lien s\'est ouvert dans une autre app (Claude, messagerie…), ouvre-le dans Chrome ou Safari. Sinon, autorise le micro pour ce site : Chrome → icône à gauche de l\'adresse → Autorisations → Micro ; iPhone → Réglages → Safari → Micro (et Réglages → Confidentialité → Micro pour Safari). Puis recharge la page.';
  if(n==='NotFoundError'||n==='OverconstrainedError')return 'Aucun micro trouvé sur cet appareil.';
  if(n==='NotReadableError')return 'Le micro est déjà utilisé par une autre app (appel, enregistreur…). Ferme-la et réessaie.';
  return 'Le micro n\'a pas pu démarrer ('+(n||'erreur inconnue')+').';
}
async function micToggle(){
  if(mic.on){micStop();return;}
  mic.err='';
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){mic.err=micError(null);showEx();return;}
  if(!audio()){mic.err='Le son n\'est pas disponible dans ce navigateur.';showEx();return;}
  try{mic.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}
  catch(e){mic.err=micError(e);showEx();return;}
  const src=ac.createMediaStreamSource(mic.stream);mic.an=ac.createAnalyser();mic.an.fftSize=16384;mic.an.smoothingTimeConstant=0;src.connect(mic.an);
  mic.fb=new Float32Array(mic.an.frequencyBinCount);mic.mag=new Float32Array(mic.an.frequencyBinCount);mic.tb=new Float32Array(2048);
  mic.on=true;mic.armed=true;mic.hist=[];mic.rmsHist=[];mic.timer=setInterval(micFrame,90);
  ex.input.clear();renderMic();showEx();
}
function micStop(){if(!mic.on)return;clearInterval(mic.timer);try{mic.stream.getTracks().forEach(t=>t.stop());}catch(e){}mic.on=false;mic.an=null;renderMic();if(S.mode==='ex')showEx();}
function renderMic(){const b=$('mic-btn');b.setAttribute('aria-pressed',mic.on);$('mic-lab').textContent=mic.on?'J\'écoute':'Écouter le piano';}
function micFrame(){
  if(!mic.an)return;
  mic.an.getFloatTimeDomainData(mic.tb);let r=0;for(let i=0;i<mic.tb.length;i++)r+=mic.tb[i]*mic.tb[i];r=Math.sqrt(r/mic.tb.length);
  $('mic-lvl').style.width=Math.min(100,r*600)+'%';
  const lowest=mic.rmsHist.length?Math.min(...mic.rmsHist):r;
  if(r>.006&&r>lowest*2.2)mic.armed=true;
  mic.rmsHist.push(r);if(mic.rmsHist.length>8)mic.rmsHist.shift();
  if(S.mode!=='ex'||ex.phase==='right'||ex.phase==='revealed'||ex.phase==='done'||!mic.armed)return;
  let notes=[];
  if(r>.003){mic.an.getFloatFrequencyData(mic.fb);for(let i=0;i<mic.fb.length;i++)mic.mag[i]=Math.pow(10,mic.fb[i]/20);
    notes=detectNotes(mic.mag,ac.sampleRate,mic.an.fftSize,kbRange[0],kbRange[1]);}
  mic.hist.push(notes);if(mic.hist.length>3)mic.hist.shift();
  const cnt={};mic.hist.forEach(h=>h.forEach(m=>cnt[m]=(cnt[m]||0)+1));
  const stable=Object.keys(cnt).filter(m=>cnt[m]>=2).map(Number).sort((a,b)=>a-b);
  const key=stable.join(',');
  if(key!==mic.key){mic.key=key;if(stable.length||ex.phase==='input'){ex.input=new Set(stable);ex.phase='input';showEx();}}
  if(stable.length&&mic.hist.length===3&&mic.hist.every(h=>h.join(',')===key)){
    const E=expected(ex.prev,seq[idx]);if(E.acc.some(c=>c.notes.join(',')===key))check();
  }
}
$('mic-btn').addEventListener('click',()=>{audio();micToggle();});

$('set-bpm').addEventListener('input',e=>{$('bpm-out').textContent=e.target.value+' bpm';});

/* ---------- onglets ---------- */
function setMode(m){stopAuto();if(m!=='ex')micStop();S.mode=m;save();
  if(m==='ex'){idx=0;resetEx();}render();}
$('tab-course').addEventListener('click',()=>setMode('course'));
$('tab-demo').addEventListener('click',()=>setMode('demo'));
$('tab-ex').addEventListener('click',()=>setMode('ex'));
function render(){
  ['course','demo','ex'].forEach(m=>$('tab-'+m).classList.toggle('on',S.mode===m));
  const c=S.mode==='course';$('course').hidden=!c;$('stage').hidden=c;$('controls').hidden=c;$('strip').hidden=c;
  $('mic-btn').hidden=S.mode!=='ex';
  if(c)renderCourse();else if(S.mode==='demo')showDemo(false);else showEx();
}
function nextLevel(){const i=LEVELS.findIndex(l=>l.id===S.level);return i>=0?LEVELS[i+1]:null;}
function startLevel(id){
  const lv=LEVELS.find(l=>l.id===id);if(!lv)return;
  S.type=lv.type;S.prog=lv.prog;S.keymode=lv.km;S.start='free';S.level=id;
  const P=PROGS[lv.prog];S.key=P.tune?KEYS.findIndex(k=>k.pc===P.keyPc):KEYS.findIndex(k=>k.id===lv.key);
  save();candCache.clear();buildSeq();buildKb();setMode('ex');
}
function finishLevel(){
  const st=ex.stats,pct=st.total?st.ok/st.total:0,stars=starsOf(pct);
  const old=LV[S.level]||{best:0};LV[S.level]={best:Math.max(old.best,pct),done:(old.done||stars>=1)};saveLV();
  ex.doneRes={pct,stars,ok:st.ok,total:st.total};ex.phase='done';idx=seq.length-1;showEx();
}
function renderCourse(){
  const nDone=LEVELS.filter(l=>LV[l.id]&&LV[l.id].done).length;
  const rec=LEVELS.find(l=>!(LV[l.id]&&LV[l.id].done));
  let n=0,h='<div><h1>Parcours</h1><p class="intro">Des basses aux voicings à deux mains, les exercices classiques du piano jazz dans l\'ordre. Un niveau est validé à 70 % d\'accords justes du premier coup ; trois étoiles à 100 %.</p></div>'+
    '<div class="overall"><span>'+nDone+' / '+LEVELS.length+' niveaux validés</span><span class="bar"><i style="width:'+(nDone/LEVELS.length*100)+'%"></i></span></div>';
  STAGES.forEach(st=>{
    h+='<section class="stg"><h2>'+st.t+'</h2><p>'+st.d+'</p><div class="lvls">';
    st.L.forEach(a=>{const lv=LEVELS[n++],r=LV[lv.id],P=PROGS[lv.prog];
      const sub=TYPES[lv.type].label+' · '+(P?P.name:'')+(lv.km==='cycle'?' · 12 tons':'');
      h+='<button class="lvl'+(r&&r.done?' done':'')+(rec===lv?' next':'')+'" data-lv="'+lv.id+'"><span class="num">'+(r&&r.done?'✓':n)+'</span><span><b>'+lv.t+'</b><small>'+(rec===lv?'À faire maintenant · ':'')+sub+'</small></span><span class="stars">'+(r?starHtml(starsOf(r.best))+'<em>'+Math.round(r.best*100)+' %</em>':'')+'</span></button>';});
    h+='</div></section>';
  });
  $('course').innerHTML=h;
  const nx=$('course').querySelector('.lvl.next');if(nx&&!renderCourse.scrolled){renderCourse.scrolled=1;}
}
$('course').addEventListener('click',e=>{const b=e.target.closest('.lvl');if(b){audio();startLevel(b.dataset.lv);}});
window.addEventListener('resize',()=>render());

buildSeq();buildKb();
render();
})();
